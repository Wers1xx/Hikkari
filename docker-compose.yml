services:
  hikkari:
    build: .
    container_name: hikkari
    restart: unless-stopped
    environment:
      - DOCKER=true
      - PYTHONUNBUFFERED=1
    volumes:
      # Persist sessions, configs, modules, inline token backups
      - hikkari_data:/data/Hikkari
    stdin_open: true
    tty: true
    # Uncomment to expose WebApp/WebUI ports if needed:
    # ports:
    #   - "16000-32000:16000-32000"

volumes:
  hikkari_data:
